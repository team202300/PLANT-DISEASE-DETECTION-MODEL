<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #f0f0ff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        #file-input {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            transform: scale(1.05);
        }
        
        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .preview-container {
            margin-top: 20px;
            text-align: center;
        }
        
        #preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .results {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .result-item {
            margin-bottom: 15px;
        }
        
        .result-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        
        .result-value {
            color: #333;
            font-size: 18px;
        }
        
        .confidence-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .confidence-fill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.5s ease;
        }
        
        .top-predictions {
            margin-top: 20px;
        }
        
        .prediction-item {
            background: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        
        .healthy {
            color: #2e7d32;
        }
        
        .diseased {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Plant Disease Detection</h1>
        <p class="subtitle">Upload a plant leaf image to detect diseases</p>
        
        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📷</div>
            <p>Click or drag and drop an image here</p>
            <p style="color: #999; font-size: 12px; margin-top: 10px;">Supports: JPG, PNG, BMP, TIFF</p>
            <input type="file" id="file-input" accept="image/*">
        </div>
        
        <div class="preview-container" id="preview-container" style="display: none;">
            <img id="preview-image" src="" alt="Preview">
            <button class="upload-btn" id="predict-btn">Analyze Image</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">Analyzing image...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="results" id="results">
            <div class="result-item">
                <div class="result-label">Plant Type:</div>
                <div class="result-value" id="plant-type"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Disease:</div>
                <div class="result-value" id="disease"></div>
            </div>
            <div class="result-item">
                <div class="result-label">Confidence:</div>
                <div class="result-value" id="confidence"></div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidence-bar"></div>
                </div>
            </div>
            <div class="result-item">
                <div class="result-label">Health Status:</div>
                <div class="result-value" id="health-status"></div>
            </div>
            
            <div class="top-predictions">
                <div class="result-label">Top Predictions:</div>
                <div id="top-predictions-list"></div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const predictBtn = document.getElementById('predict-btn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        
        let selectedFile = null;
        
        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // File selection
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showError('Please select a valid image file');
                return;
            }
            
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                results.style.display = 'none';
                error.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            predictBtn.disabled = true;
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                } else {
                    showResults(data);
                }
            } catch (err) {
                showError('An error occurred while analyzing the image');
            } finally {
                loading.style.display = 'none';
                predictBtn.disabled = false;
            }
        });
        
        function showResults(data) {
            const pred = data.prediction;
            
            document.getElementById('plant-type').textContent = pred.plant;
            document.getElementById('disease').textContent = pred.disease;
            document.getElementById('confidence').textContent = pred.confidence.toFixed(2) + '%';
            document.getElementById('confidence-bar').style.width = pred.confidence + '%';
            
            const healthStatus = document.getElementById('health-status');
            healthStatus.textContent = pred.is_healthy ? 'Healthy ✅' : 'Diseased ⚠️';
            healthStatus.className = 'result-value ' + (pred.is_healthy ? 'healthy' : 'diseased');
            
            // Top predictions
            const topPredsList = document.getElementById('top-predictions-list');
            topPredsList.innerHTML = '';
            data.top_predictions.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'prediction-item';
                item.innerHTML = `
                    <span>${i + 1}. ${p.plant} - ${p.disease}</span>
                    <span><strong>${p.probability.toFixed(2)}%</strong></span>
                `;
                topPredsList.appendChild(item);
            });
            
            results.style.display = 'block';
        }
        
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
